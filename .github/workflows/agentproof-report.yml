name: AgentProof review report

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AgentProof
        run: python -m pip install -e .
      - name: Capture task baseline
        run: agentproof init --goal "Review pull request changes"
      - name: Run configured checks
        run: agentproof check
      - name: Upload AgentProof report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentproof-report
          path: .agentproof/
          if-no-files-found: error
