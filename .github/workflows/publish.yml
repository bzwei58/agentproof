name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PYTHON'
          import os, runpy, tomllib
          version = runpy.run_path("agentproof/__init__.py")["__version__"]
          metadata = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if os.environ["RELEASE_TAG"] != "v" + version or version != metadata:
              raise SystemExit("Release tag, package version and metadata must match")
          PYTHON
      - name: Run release tests
        run: python -m unittest discover -s tests -v
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Validate distributions
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
