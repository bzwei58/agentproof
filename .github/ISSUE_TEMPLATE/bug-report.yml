name: Bug report
description: Report a reproducible behavior problem without sharing private project data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not include source code, credentials, `.agentproof/`, or raw AI transcripts. Redact logs before attaching them.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.2.0 or git commit"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe reproduction and command output with secrets removed.
    validations:
      required: true
