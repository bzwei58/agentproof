[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof-cli"
version = "0.8.0"
description = "Local evidence, checkpoints, and verification for AI coding tasks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.setuptools.packages.find]
include = ["agentproof*"]
